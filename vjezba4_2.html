<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vježba 12</title>
</head>
<body>

    <form action="#" method="post">
        <label for="firstname">First Name *</label><br>
        <input type="text" id="firstname" name="firstname" placeholder="Your first name.."><br><br>

        <label for="lastname">Last Name *</label><br>
        <input type="text" id="lastname" name="lastname" placeholder="Your last name.."><br><br>

        <label for="email">Your E-mail *</label><br>
        <input type="email" id="email" name="email" placeholder="Your e-mail.."><br><br>

        <label for="country">Country</label><br>
        <select id="country" name="country">
            <option value="croatia" selected>Croatia</option>
            <option value="slovenia">Slovenia</option>
            <option value="germany">Germany</option>
            <option value="austria">Austria</option>
        </select><br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" rows="4" cols="30" placeholder="Write something..."></textarea><br><br>

        <input type="submit" value="Send">
        <input type="reset" value="Reset">
    </form>

</body>
</html>
