<!DOCTYPE html>
<html lang="hr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LEGO Vježba 12</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: #ffffff;
            border: 1px solid #ddd;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .hero-banner {
            background-color: #f7d117;
            position: relative;
            padding: 20px;
        }
        .logo {
            background-color: #e3000b;
            color: white;
            font-weight: bold;
            padding: 8px 15px;
            display: inline-block;
            font-size: 20px;
            border-radius: 4px;
        }
        .banner-image {
            width: 100%;
            height: auto;
            display: block;
            margin-top: 10px;
        }
        .navbar {
            background-color: #222;
            display: flex;
            justify-content: center;
            padding: 10px 0;
        }
        .navbar a {
            color: white;
            text-decoration: none;
            padding: 8px 20px;
            margin: 0 5px;
            border: 1px solid #444;
            background-color: #333;
            font-size: 14px;
        }
        .navbar a:hover {
            background-color: #555;
        }
        .footer {
            padding: 10px 20px;
            font-size: 12px;
            color: #666;
            background-color: #fff;
            border-top: 1px solid #eee;
        }
    </style>
</head>

    </div>
</div>

</body>
</html>
